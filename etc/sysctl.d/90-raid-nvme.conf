# Kernel tuning for a workstation with an NVMe RAID1 (md) data volume and 96 GB RAM.
# Ubuntu 26.04 no longer ships /etc/sysctl.conf; drop-ins in /etc/sysctl.d/ are the supported place.
# Apply: sudo install -m 644 90-raid-nvme.conf /etc/sysctl.d/ && sudo sysctl --system

# Write-back: start background flushing early and cap dirty memory; 5% of 96 GB is still 4.8 GB.
vm.dirty_background_ratio = 2
vm.dirty_ratio = 5
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 2000
vm.swappiness = 5
vm.vfs_cache_pressure = 50
vm.min_free_kbytes = 131072

# File handles and watches for large source trees, editors and container builds.
fs.file-max = 1000000
fs.nr_open = 1000000
fs.aio-max-nr = 524288
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# md resync ceiling. 1 GB/s keeps a 4 TB rebuild under an hour and a half without driving the source
# drive at its limit for the whole pass; a 990 PRO used as the rebuild source hung its controller at
# 1.3 GB/s sustained. Raise for one run with sysctl -w if the drives are proven cool.
dev.raid.speed_limit_min = 200000
dev.raid.speed_limit_max = 1000000

# Socket buffers for 10 GbE.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 87380 16777216

# Deliberately not set, unlike the 2025 version of this file:
#   vm.nr_hugepages = 2048   reserved 4 GB permanently for nothing that used it
#   vm.overcommit_memory = 1 lets any allocation succeed; the default heuristic is the safer choice
